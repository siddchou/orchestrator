<div class="dialog">
  <div class="dialog-header">
    <div class="dialog-icon">
      <mat-icon>warning_amber</mat-icon>
    </div>
    <h2 class="dialog-title">{{ data.title }}</h2>
  </div>
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button (click)="cancel()" matTooltip="Cancel this action">Cancel</button>
    <button mat-flat-button color="warn" (click)="confirm()" [matTooltip]="data.message.includes('Delete') ? 'This action cannot be undone' : null">{{ data.confirmButton ?? 'Confirm' }}</button>
  </mat-dialog-actions>
</div>
