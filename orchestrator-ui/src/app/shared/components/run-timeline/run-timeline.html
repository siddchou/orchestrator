<div class="timeline-card">
  <div class="timeline-header">
    <mat-icon class="timeline-icon">timeline</mat-icon>
    <span class="timeline-title">Execution Timeline</span>
    <span class="timeline-step-count">{{ bars.length }} steps</span>
  </div>

  <div class="timeline-track">
    <!-- Grid lines -->
    @for (tick of ticks; track $index) {
      <div class="grid-line" [style.left.%]="tick.leftPercent"></div>
    }

    <!-- Step bars -->
    @for (bar of bars; track bar.step.runStepId; let i = $index) {
      <div
        class="step-bar"
        [class.step-bar-unknown]="bar.hasNullTime"
        [style.left.%]="bar.leftPercent"
        [style.width.%]="bar.widthPercent"
        [style.background]="bar.colorVar"
        [style.--row-index]="i"
        [title]="bar.step.stepName + (bar.hasNullTime ? ' (timestamp unknown)' : '')"
      >
        <span class="step-bar-label">
          @if (bar.hasNullTime) {
            <mat-icon>warning</mat-icon>
          }
          {{ bar.step.stepName }}
        </span>
      </div>
    }
  </div>

  <!-- Time axis labels -->
  <div class="time-axis">
    @for (tick of ticks; track $index) {
      <div class="time-tick" [style.left.%]="tick.leftPercent">{{ tick.label }}</div>
    }
  </div>
</div>
