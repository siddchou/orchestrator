<div class="log-toolbar">
  <div class="toolbar-left">
    <mat-slide-toggle [(ngModel)]="autoScroll" matTooltip="Auto-scroll to latest log entry">
      <span class="toggle-label">Auto-scroll</span>
    </mat-slide-toggle>
    @if (running) {
      <span class="live-badge">
        <span class="live-dot"></span> Streaming
      </span>
    } @else {
      <span class="stopped-badge">Completed</span>
    }
  </div>
  <div class="toolbar-right">
    <span class="log-count">{{ logLines.length }} lines</span>
    <button mat-stroked-button (click)="clearLog()" class="clear-btn" matTooltip="Clear all log lines">
      <mat-icon>clear_all</mat-icon> Clear
    </button>
  </div>
</div>
<div class="log-container" #logContainer>
  @for (line of logLines; track $index) {
    <div class="log-line">{{ line }}</div>
  }
  @if (running) {
    <span class="cursor">▮</span>
  }
</div>
