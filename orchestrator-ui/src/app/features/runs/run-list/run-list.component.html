<h2>Run History</h2>

<!-- Filters -->
<form [formGroup]="filterForm" class="filters-row">
  <mat-form-field appearance="outline">
    <mat-label>Job ID</mat-label>
    <input matInput type="number" formControlName="jobId" placeholder="All jobs">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option [value]="null">All</mat-option>
      @for (s of allStatuses; track s) {
        <mat-option [value]="s">{{ s }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>From</mat-label>
    <input matInput [matDatepicker]="fromPicker" formControlName="from">
    <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
    <mat-datepicker #fromPicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>To</mat-label>
    <input matInput [matDatepicker]="toPicker" formControlName="to">
    <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
    <mat-datepicker #toPicker></mat-datepicker>
  </mat-form-field>

  <div class="filter-buttons">
    <button mat-raised-button color="primary" (click)="applyFilters()">Apply</button>
    <button mat-stroked-button (click)="clearFilters()">Clear</button>
  </div>
</form>

<mat-spinner diameter="32" *ngIf="loading"></mat-spinner>

<table mat-table [dataSource]="runs" class="runs-table" *ngIf="!loading">
  <ng-container matColumnDef="jobName">
    <th mat-header-cell *matHeaderCellDef>Job</th>
    <td mat-cell *matCellDef="let run"><strong>{{ run.jobName }}</strong></td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let run">
      <app-status-badge [status]="run.status" />
    </td>
  </ng-container>

  <ng-container matColumnDef="triggerType">
    <th mat-header-cell *matHeaderCellDef>Trigger</th>
    <td mat-cell *matCellDef="let run">{{ run.triggerType }}</td>
  </ng-container>

  <ng-container matColumnDef="triggeredBy">
    <th mat-header-cell *matHeaderCellDef>By</th>
    <td mat-cell *matCellDef="let run">{{ run.triggeredBy }}</td>
  </ng-container>

  <ng-container matColumnDef="startedAt">
    <th mat-header-cell *matHeaderCellDef>Started</th>
    <td mat-cell *matCellDef="let run">
      {{ run.startedAt | date:'dd MMM HH:mm:ss' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="duration">
    <th mat-header-cell *matHeaderCellDef>Duration</th>
    <td mat-cell *matCellDef="let run">{{ run.durationSeconds | duration }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let run">
      <button mat-button (click)="viewRun(run.runId)">View</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row
      *matRowDef="let row; columns: displayedColumns;"
      [class.running-row]="row.status === 'RUNNING'"
      (click)="viewRun(row.runId)">
  </tr>
</table>

<mat-paginator
  [length]="totalElements"
  [pageSize]="size"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPage($event)">
</mat-paginator>
