<div class="dialog-container">
  <!-- Dialog Header -->
  <div class="dialog-header">
    <div class="header-icon" [class.edit]="data.stepId">
      <mat-icon>{{ data.stepId ? 'edit' : 'add' }}</mat-icon>
    </div>
    <h2 class="dialog-title">{{ data.stepId ? 'Edit Step' : 'Add Step' }}</h2>
  </div>

  <mat-dialog-content [formGroup]="form">
    <!-- Common fields -->
    <div class="field-group">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Step Name</mat-label>
        <mat-icon matPrefix>label</mat-icon>
        <input matInput formControlName="stepName" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Step Type</mat-label>
        <mat-icon matPrefix>category</mat-icon>
        <mat-select formControlName="stepType">
          @for (schema of availableTypes; track schema.stepType) {
            <mat-option [value]="schema.stepType">{{ schema.displayName }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="toggles-row">
      <mat-slide-toggle formControlName="continueOnFailure">Continue on failure</mat-slide-toggle>
      <mat-slide-toggle formControlName="enabled">Enabled</mat-slide-toggle>
    </div>

    @if (form.get('stepType')?.value) {
      <div class="section-divider"></div>
      <app-dynamic-step-form
        #dynamicForm
        [schema]="selectedSchema!"
        [existingConfig]="existingConfig"
        [credentials]="credentials" />
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
      <mat-icon>{{ data.stepId ? 'save' : 'add' }}</mat-icon>
      {{ data.stepId ? 'Update' : 'Add' }}
    </button>
  </mat-dialog-actions>
</div>
