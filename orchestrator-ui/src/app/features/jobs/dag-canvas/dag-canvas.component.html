<div class="dag-canvas-wrapper">
  <div class="canvas-toolbar">
    <button mat-icon-button (click)="addStepRequested.emit()" aria-label="Add step" title="Add Step"><mat-icon>add</mat-icon></button>
    <span class="toolbar-spacer"></span>
    <span class="dirty-indicator" *ngIf="isDirty">● unsaved</span>
    <button mat-flat-button (click)="onSaveClicked()" [disabled]="!isDirty" title="Save Dependencies">Save</button>
  </div>

  <div
    class="canvas-container"
    #canvasContainer
    (wheel)="onWheel($event)"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp()"
    (mouseleave)="onMouseUp()"
  >
    <div class="canvas-surface" [style.transform]="getTransform()">
      <!-- Grid background -->
      <svg class="grid-svg">
        <defs>
          <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--dag-canvas-grid-color, #e0e0e0)" stroke-width="0.5" />
          </pattern>
          <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#smallGrid)" />
            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--dag-canvas-grid-color, #e0e0e0)" stroke-width="1" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
      </svg>

      <!-- SVG edges layer -->
      <svg class="edges-svg" #svgLayer>
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--dag-edge-color, #616161)" />
          </marker>
        </defs>

        @for (edge of edges; track edge.from * 1000 + edge.to) {
          @let path = getEdgePath(edge);
          @if (path) {
            <path
              [attr.d]="path.d"
              fill="none"
              stroke="var(--dag-edge-color, #616161)"
              stroke-width="2"
              marker-end="url(#arrowhead)"
            />
            <text
              [attr.x]="path.midX"
              [attr.y]="path.midY - 5"
              text-anchor="middle"
              class="edge-label"
            >{{ conditionSymbol(edge.condition) }}</text>
          }
        }

        <!-- Rubber band line -->
        @if (rubberBand?.active) {
          <line
            [attr.x1]="rubberBand.x / panZoom.scale - panZoom.offsetX / panZoom.scale"
            [attr.y1]="rubberBand.y / panZoom.scale - panZoom.offsetY / panZoom.scale"
            [attr.x2]="rubberBand.x / panZoom.scale - panZoom.offsetX / panZoom.scale"
            [attr.y2]="rubberBand.y / panZoom.scale - panZoom.offsetY / panZoom.scale"
            stroke="var(--dag-port-color, #6750a4)"
            stroke-width="2"
            stroke-dasharray="5,5"
          />
        }
      </svg>

      <!-- Node layer -->
      @for (node of nodes; track node.stepId ?? $index) {
        <app-dag-node
          [node]="node"
          [readOnly]="false"
          (edgeStart)="onEdgeStart($event)"
          (edgeTargetHover)="onEdgeTargetHover($event)"
          (nodeClick)="onNodeClick($event)"
          (deleteRequested)="onDeleteRequested($event)"
        ></app-dag-node>
      }

      <!-- Edge condition picker -->
      @if (pickerVisible) {
        <app-edge-condition-picker
          [position]="pickerPosition"
          (selected)="onPickerSelected($event)"
          (closed)="onPickerClosed()"
        ></app-edge-condition-picker>
      }
    </div>
  </div>

  <!-- Zoom controls -->
  <div class="zoom-controls">
    <button mat-mini-fab (click)="zoomIn()" title="Zoom in">+</button>
    <button mat-mini-fab (click)="zoomOut()" title="Zoom out">−</button>
    <button mat-mini-fab (click)="fitToView()" title="Fit to view">⊡</button>
  </div>
</div>
