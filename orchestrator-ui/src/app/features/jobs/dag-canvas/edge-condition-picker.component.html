<div class="edge-condition-picker" [style.left.px]="position.x" [style.top.px]="position.y" #picker>
  <div class="option" *ngFor="let opt of options" (click)="onSelect(opt.value)" [title]="opt.label">
    <span class="symbol">{{ opt.symbol }}</span>
    <span class="label">{{ opt.label }}</span>
  </div>
</div>
