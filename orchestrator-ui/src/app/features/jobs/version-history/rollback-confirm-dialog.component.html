<div class="dialog-header">
  <mat-icon color="warn">undo</mat-icon>
  <h2>Rollback Version</h2>
</div>

<p class="message">Roll this job back to <strong>v{{ data.versionNumber }}</strong>?</p>

<div class="version-info">
  <span>Created by: {{ data.createdBy }}</span>
  <span>Date: {{ formatDate(data.createdAt) }}</span>
</div>

@if (data.hasActiveRun) {
  <div class="warning-banner">
    <mat-icon>warning</mat-icon>
    <span>This job has an active schedule. Rolling back will not affect the next scheduled run.</span>
  </div>
}

<div class="dialog-actions">
  <button mat-stroked-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="warn" (click)="confirm()">
    <mat-icon>undo</mat-icon> Rollback
  </button>
</div>
