<div class="header-row">
  <h2>Jobs</h2>
  <div class="header-actions">
    <mat-form-field appearance="outline">
      <mat-label>Search jobs...</mat-label>
      <input matInput id="searchInput" (keyup.enter)="search()" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
    <button mat-flat-button color="primary" routerLink="/jobs/new">
      <mat-icon>add</mat-icon>
      <span>New Job</span>
    </button>
  </div>
</div>

<table mat-table [dataSource]="jobs" class="jobs-table">
  <ng-container matColumnDef="jobName">
    <th mat-header-cell *matHeaderCellDef>Job Name</th>
    <td mat-cell *matCellDef="let job">
      <a [routerLink]="'/jobs/' + job.jobId" class="job-link">{{ job.jobName }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let job">{{ job.description || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="enabled">
    <th mat-header-cell *matHeaderCellDef>Enabled</th>
    <td mat-cell *matCellDef="let job">
      <span class="enabled-dot" [class.on]="job.enabled"></span>
      {{ job.enabled ? 'Yes' : 'No' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="steps">
    <th mat-header-cell *matHeaderCellDef>Steps</th>
    <td mat-cell *matCellDef="let job">{{ job.steps?.length || 0 }}</td>
  </ng-container>

  <ng-container matColumnDef="schedule">
    <th mat-header-cell *matHeaderCellDef>Schedule</th>
    <td mat-cell *matCellDef="let job">
      {{ job.schedule?.cronExpression || '—' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let job">
      <button mat-icon-button [routerLink]="'/jobs/' + job.jobId" matTooltip="Edit">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="triggerRun(job)" matTooltip="Run now">
        <mat-icon>play_arrow</mat-icon>
      </button>
      <button mat-icon-button (click)="toggleEnabled(job)" matTooltip="Toggle enabled">
        <mat-icon>{{ job.enabled ? 'toggle_off' : 'toggle_on' }}</mat-icon>
      </button>
      <button mat-icon-button (click)="deleteJob(job)" matTooltip="Delete" color="warn">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div class="pagination">
  <button mat-button (click)="setPage(page - 1)" [disabled]="!hasPrevious">Previous</button>
  <span>Page {{ page + 1 }} ({{ totalElements }} total)</span>
  <button mat-button (click)="setPage(page + 1)" [disabled]="!hasNext">Next</button>
</div>
