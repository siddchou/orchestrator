spring:
  application:
    name: orchestrator
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST}:1521/${DB_SERVICE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

orchestrator:
  engine:
    thread-pool-size: 10
    default-step-timeout-minutes: 60
    log-retention-days: 30
  sftp:
    known-hosts-file: ${ORCH_HOME:/opt/orchestrator}/.ssh/known_hosts
  archive:
    base-dir: ${ORCH_HOME:/opt/orchestrator}/archives
  plugins:
    dir: ${ORCH_HOME:/opt/orchestrator}/plugins
  security:
    jwt-secret: ${JWT_SECRET:default-secret-key-must-be-at-least-32-changes!!}
    jwt-expiry-hours: 8

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
